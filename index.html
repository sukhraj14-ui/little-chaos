:root{font-family:ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;color:#f9f4ff;background:#181329}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 10%,#4d286d 0,#211731 45%,#151020 100%)}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:3px solid #ffe28a;outline-offset:3px}.app{max-width:510px;min-height:100dvh;margin:auto;padding:22px 18px 34px;display:flex;flex-direction:column;gap:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:1.5rem;font-weight:900;letter-spacing:-.8px}.pill{background:#ffffff17;border:1px solid #ffffff25;color:#fff;border-radius:30px;padding:9px 12px}.panel{background:#ffffff10;border:1px solid #ffffff1f;border-radius:24px;padding:18px;box-shadow:0 12px 45px #0002}.sub{color:#cbbbdc;font-size:.92rem}.center{text-align:center}.mascot{width:210px;max-width:75%;display:block;margin:0 auto;filter:drop-shadow(0 18px 16px #0005);animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-9px) rotate(2deg)}}.bubble{position:relative;background:#fff;color:#332447;padding:17px 18px;border-radius:19px;font-weight:750;line-height:1.45;text-align:center;min-height:76px;display:grid;place-items:center}.bubble:before{content:'';position:absolute;top:-11px;left:calc(50% - 12px);border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:13px solid white}.game{min-height:175px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden}.primary{background:#e9d1ff;color:#301643;font-weight:900;border-radius:16px;padding:15px 20px;min-height:50px;box-shadow:0 6px 0 #9b71b9}.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #9b71b9}.secondary{background:#ffffff18;color:white;border:1px solid #ffffff30;border-radius:14px;padding:12px 16px}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:c (()=>{'use strict';const T={en:{chapter:'The chaos begins',restart:'↻ Restart',level:'Level',of:'of',hint:'💡 Hint',next:'Next level →',again:'Play again ↻',complete:'You escaped... for now! 🎉',footer:'Free • No accounts • No ads • Progress saved on this device',solved:'Solved! +100 chaos points ✨',titles:['Don’t Trust Me','The Wrong Answer','Where’s the Key?','Memory Mischief','The Final Trick'],instructions:['The creature wants you to press the button. Should you?','Choose the color of the word, NOT what the word says.','The key is hidden somewhere in the room. Find it!','Memorize the three emojis. Then answer the question.','The creature says you can’t win. Prove it wrong.'],intro:['Go on. Press the big button. I definitely won’t laugh. 😇','This is easy. Which probably means you’ll get it wrong.','I ate the key. Or did I? 👀','Remember these. I believe in you... a little.','Final level. Try not to embarrass yourself.'],hints:['Psst. The level title is secretly a button.','Look at the INK color. Ignore the word itself.','Try tapping the creature’s shadow... just kidding. Look for the tiny star.','The middle emoji is the one you need.','Tap the word “wrong” in my sentence.'],roasts:['You fell for that? Incredible. 💀','My pet rock is taking notes from you. 🪨','At this point, the button deserves a break.','That was a bold strategy. A bad one, but bold.'],win:['WAIT. You figured it out?! 😳','Lucky guess. Obviously. 🙄','Hey! That was MY key!','Fine. Your memory works. Occasionally.','NOOO! You beat me! Rematch?!'],press:'PRESS ME 😈',colors:['Red','Blue','Green','Yellow'],colorQuestion:'What color is the TEXT?',search:'Find the hidden key',memoryStart:'Remember these:',memoryQuestion:'Which emoji was in the middle?',finalText:'You will never win. You are always ',finalWord:'wrong',finalEnd:'!',finalNote:'Hint: one word in the sentence is tappable.',finish:'5 levels conquered. The blob is furious.',score:'Chaos points',resetConfirm:'Restart all levels?',no:'Cancel',yes:'Re les?',no:'Cancelar',yes:'Reiniciar'}};
const $=id=>document.getElementById(id);let lang=localStorage.getItem('lc-lang')==='es'?'es':'en',level=Math.max(0,Math.min(5,Number(localStorage.getItem('lc-level'))||0)),attempts=0,hinted=false,solved=false,memoryStage=0,chosenColor=1;const t=()=>T[lang];let voiceEnabled=localStorage.getItem('lc-voice')!=='off',utteranceToken=0;function updateVoiceButton(){const b=$('voiceToggle');b.textContent=voiceEnabled?'🔊':'🔇';b.setAttribute('aria-label',lang==='es'?(voiceEnabled?'Silenciar voz':'Activar voz'):(voiceEnabled?'Mute voice':'Enable voice'));b.setAttribute('aria-pressed',String(voiceEnabled))}function speak(s){$('speech').textContent=s;const monster=$('chaosMascot');monster.classList.remove('talking');if(!('speechSynthesis' in window)||!voiceEnabled)return;window.speechSynthesis.cancel();const token=++utteranceToken;const u=new SpeechSynthesisUtterance(s.replace(/[\u{1F300}-\u{1FAFF}]/gu,''));u.lang=lang==='es'?'es-ES':'en-US';u.rate=1.08;u.pitch=1.27;const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>v.lang.toLowerCase().startsWith(lang==='es'?'es':'en')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith(lang==='es'?'es':'en'));if(voice)u.voice=voice;u.onstart=()=>{if(token===utteranceToken)monster.classList.add('talking')};u.onend=u.onerror=()=>{if(token===utteranceToken)monster.classList.remove('talking')};window.speechSynthesis.speak(u)}function button(label,fn,cls='choice'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b}function roast(){attempts++;speak(t().roasts[(attempts-1)%4]);$('chaosMascot').classList.remove('excited')}function win(){if(solved)return;solved=true;speak(t().win[level]);$('success').textContent=t().solved;$('success').classList.remove('hidden');$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('chaosMascot').classList.add('excited');$('next').textContent=level===4?t().again:t().next}function render(){updateVoiceButton();document.documentElement.lang=lang;localStorage.setItem('lc-lang',lang);$('langEN').setAttribute('aria-pressed',lang==='en');$('langES').setAttribute('aria-pressed',lang==='es');$('reset').textContent=t().restart;$('chapter').textContent=t().chapter;$('footer').textContent=t().footer;$('hint').textContent=t().hint;$('bar').style.width=(level/5*100)+'%';$('success').classList.add('hidden');$('next').classList.add('hidden');$('hint').classList.remove('hidden');$('game').replaceChildren();if(level>=5){$('bar').style.width='100%';$('count').textContent='5/5';$('levelTitle').textContent=t().complete;$('instruction').textContent=t().finish;speak(lang==='en'?'I demand a sequel. And snacks. 😤':'Exijo una segunda parte. Y comida. 😤');$('game').append(button(t().again,()=>{level=0;save();resetRound();render()},'primary'));$('hint').classList.add('hidden');return} $('count').textContent=`${t().level} ${level+1} ${t().of} 5`;$('levelTitle').textContent=t().titles[level];$('instruction').textContent=t().instructions[level];if(!hinted&&attempts===0&&!solved)speak(t().intro[level]);if(solved){$('success').textContent=t().solved;$('success').classList.remove('hidden');$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=level===4?t().again:t().next;return}const g=$('game');if(level===0){const b=button(t().press,()=>{roast();b.style.transform=`translateX(${attempts%2?75:-75}px) rotate(${attempts%2?8:-8}deg)`},'primary moving');g.append(b)}if(level===1){const word=document.createElement('div');word.style.cssText='font-size:clamp(2.8rem,12vw,4.5rem);font-weight:1000;color:#3b9fff';word.textContent=lang==='en'?'RED':'ROJO';g.append(word);const q=document.createElement('div');q.className='sub';q.textContent=t().colorQuestion;g.append(q);const choices=document.createElement('div');choices.className='choices';t().colors.forEach((x,i)=>choices.append(button(x,()=>i===1?win():roast())));g.append(choices)}if(level===2){const s=document.createElement('div');s.className='symbols';s.textContent='☁️  🌙  ☁️';g.append(s);const star=button('✦',win,'secondary');star.style.cssText='position:absolute;bottom:4px;right:10px;font-size:11px;opacity:.42;padding:7px';star.setAttribute('aria-label',lang==='en'?'Hidden star':'Estrella escondida');g.append(star);g.append(button(lang==='en'?'Open the chest 🔒':'Abrir el cofre 🔒',roast,'primary'))}if(level===3){if(memoryStage===0){const display=document.createElement('div');display.className='symbols';display.textContent='🐸 🍕 🚀';g.append(display);g.append(button(lang==='en'?'Ready!':'¡Listo!',()=>{memoryStage=1;render()},'primary'));}else{const q=document.createElement('div');q.className='sub';q.textContent=t().memoryQuestion;g.append(q);const choices=document.createElement('div');choices.className='choices';['🚀','🍕','🐸','🍉'].forEach((e,i)=>choices.append(button(e,()=>i===1?win():roast())));g.append(choices)}}if(level===4){const p=document.createElement('p');p.className='center';p.style.cssText='font-size:1.3rem;line-height:1.7;font-weight:800';p.append(document.createTextNode(t().finalText));const secret=button(t().finalWord,win,'secondary');secret.style.cssText='display:inline;padding:4px 8px;text-decoration:underline;text-decoration-style:wavy';p.append(secret,document.createTextNode(t().finalEnd));g.append(p);g.append(button(lang==='en'?'I give up 😭':'Me rindo 😭',roast,'primary'))}}function resetRound(){attempts=0;hinted=false;solved=false;memoryStage=0}function save(){localStorage.setItem('lc-level',String(level))}$('voiceToggle').onclick=()=>{voiceEnabled=!voiceEnabled;localStorage.setItem('lc-voice',voiceEnabled?'on':'off');if(!voiceEnabled&&'speechSynthesis' in window)window.speechSynthesis.cancel();$('chaosMascot').classList.remove('talking');updateVoiceButton();if(voiceEnabled)speak($('speech').textContent)};$('langEN').onclick=()=>{lang='en';render()};$('langES').onclick=()=>{lang='es';render()};$('hint').onclick=()=>{hinted=true;speak(t().hints[level])};$('levelTitle').onclick=()=>{if(level===0&&!solved)win()};$('levelTitle').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&level===0){e.preventDefault();win()}};$('next').onclick=()=>{level=level===4?5:level+1;save();resetRound();render()};$('reset').onclick=()=>{if(confirm(t().resetConfirm)){level=0;save();resetRound();render()}};render()})();
