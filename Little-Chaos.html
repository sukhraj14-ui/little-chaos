(()=>{'use strict';const T={en:{chapter:'The chaos begins',restart:'↻ Restart',level:'Level',of:'of',hint:'💡 Hint',next:'Next level →',again:'Play again ↻',complete:'You escaped... for now! 🎉',footer:'Free • No accounts • No ads • Progress saved on this device',solved:'Solved! +100 chaos points ✨',titles:['Don’t Trust Me','The Wrong Answer','Where’s the Key?','Memory Mischief','The Final Trick'],instructions:['The creature wants you to press the button. Should you?','Choose the color of the word, NOT what the word says.','The key is hidden somewhere in the room. Find it!','Memorize the three emojis. Then answer the question.','The creature says you can’t win. Prove it wrong.'],intro:['Go on. Press the big button. I definitely won’t laugh. 😇','This is easy. Which probably means you’ll get it wrong.','I ate the key. Or did I? 👀','Remember these. I believe in you... a little.','Final level. Try not to embarrass yourself.'],hints:['Psst. The level title is secretly a button.','Look at the INK color. Ignore the word itself.','Try tapping the creature’s shadow... just kidding. Look for the tiny star.','The middle emoji is the one you need.','Tap the word “wrong” in my sentence.'],roasts:['You fell for that? Incredible. 💀','My pet rock is taking notes from you. 🪨','At this point, the button deserves a break.','That was a bold strategy. A bad one, but bold.'],win:['WAIT. You figured it out?! 😳','Lucky guess. Obviously. 🙄','Hey! That was MY key!','Fine. Your memory works. Occasionally.','NOOO! You beat me! Rematch?!'],press:'PRESS ME 😈',colors:['Red','Blue','Green','Yellow'],colorQuestion:'What color is the TEXT?',search:'Find the hidden key',memoryStart:'Remember these:',memoryQuestion:'Which emoji was in the middle?',finalText:'You will never win. You are always ',finalWord:'wrong',finalEnd:'!',finalNote:'Hint: one word in the sentence is tappable.',finish:'5 levels conquered. The blob is furious.',score:'Chaos points',resetConfirm:'Restart all levels?',no:'Cancel',yes:'Restart'},es:{chapter:'El caos comienza',restart:'↻ Reiniciar',level:'Nivel',of:'de',hint:'💡 Pista',next:'Siguiente nivel →',again:'Jugar otra vez ↻',complete:'¡Escapaste... por ahora! 🎉',footer:'Gratis • Sin cuentas • Sin anuncios • Progreso guardado en este dispositivo',solved:'¡Resuelto! +100 puntos de caos ✨',titles:['No confíes en mí','La respuesta equivocada','¿Dónde está la llave?','Memoria traviesa','El truco final'],instructions:['La criatura quiere que pulses el botón. ¿Deberías hacerlo?','Elige el color de las LETRAS, no lo que dice la palabra.','La llave está escondida en algún lugar. ¡Encuéntrala!','Memoriza los tres emojis. Después responde.','La criatura dice que no puedes ganar. Demuéstrale lo contrario.'],intro:['Vamos. Pulsa el botón. Prometo no reírme. 😇','Es facilísimo. Así que seguro te equivocas.','Me comí la llave. ¿O no? 👀','Recuerda estos. Confío en ti... un poquito.','Último nivel. Intenta no hacer el ridículo.'],hints:['Oye, el título del nivel es un botón secreto.','Mira el color de las LETRAS. Ignora la palabra.','Prueba con la sombra... ¡es broma! Busca la estrellita.','Necesitas el emoji del medio.','Pulsa la palabra «equivocas» en mi frase.'],roasts:['¿Caíste en esa? Increíble. 💀','Mi piedra mascota aprende más rápido. 🪨','A este paso, el botón va a pedir vacaciones.','Una estrategia valiente. Mala, pero valiente.'],win:['¿QUÉ? ¡Lo descubriste! 😳','Pura suerte. Obviamente. 🙄','¡Oye! ¡Esa era MI llave!','Vale, tu memoria funciona. A veces.','¡NOOO! ¡Me ganaste! ¿Revancha?'],press:'PÚLSAME 😈',colors:['Rojo','Azul','Verde','Amarillo'],colorQuestion:'¿De qué color son las LETRAS?',search:'Encuentra la llave escondida',memoryStart:'Recuerda estos:',memoryQuestion:'¿Qué emoji estaba en el medio?',finalText:'Nunca ganarás. Siempre te ',finalWord:'equivocas',finalEnd:'!',finalNote:'Pista: puedes pulsar una palabra de la frase.',finish:'5 niveles superados. La criatura está furiosa.',score:'Puntos de caos',resetConfirm:'¿Reiniciar todos los nive const $=id=>document.getElementById(id);let lang=localStorage.getItem('lc-lang')==='es'?'es':'en',level=Math.max(0,Math.min(5,Number(localStorage.getItem('lc-level'))||0)),attempts=0,hinted=false,solved=false,memoryStage=0,chosenColor=1;const t=()=>T[lang];function speak(s){$('speech').textContent=s}function button(label,fn,cls='choice'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b}function roast(){attempts++;speak(t().roasts[(attempts-1)%4]);$('mouth').setAttribute('d','M97 129Q119 149 140 125')}function win(){if(solved)return;solved=true;speak(t().win[level]);$('success').textContent=t().solved;$('success').classList.remove('hidden');$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('mouth').setAttribute('d','M98 133Q119 118 140 133');$('next').textContent=level===4?t().again:t().next}function render(){document.documentElement.lang=lang;localStorage.setItem('lc-lang',lang);$('langEN').setAttribute('aria-pressed',lang==='en');$('langES').setAttribute('aria-pressed',lang==='es');$('reset').textContent=t().restart;$('chapter').textContent=t().chapter;$('footer').textContent=t().footer;$('hint').textContent=t().hint;$('bar').style.width=(level/5*100)+'%';$('success').classList.add('hidden');$('next').classList.add('hidden');$('hint').classList.remove('hidden');$('game').replaceChildren();if(level>=5){$('bar').style.width='100%';$('count').textContent='5/5';$('levelTitle').textContent=t().complete;$('instruction').textContent=t().finish;speak(lang==='en'?'I demand a sequel. And snacks. 😤':'Exijo una segunda parte. Y comida. 😤');$('game').append(button(t().again,()=>{level=0;save();resetRound();render()},'primary'));$('hint').classList.add('hidden');return} $('count').textContent=`${t().level} ${level+1} ${t().of} 5`;$('levelTitle').textContent=t().titles[level];$('instruction').textContent=t().instructions[level];if(!hinted&&attempts===0&&!solved)speak(t().intro[level]);if(solved){$('success').textContent=t().solved;$('success').classList.remove('hidden');$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=level===4?t().again:t().next;return}const g=$('game');if(level===0){const b=button(t().press,()=>{roast();b.style.transform=`translateX(${attempts%2?75:-75}px) rotate(${attempts%2?8:-8}deg)`},'primary moving');g.append(b)}if(level===1){const word=document.createElement('div');word.style.cssText='font-size:clamp(2.8rem,12vw,4.5rem);font-weight:1000;color:#3b9fff';word.textContent=lang==='en'?'RED':'ROJO';g.append(word);const q=document.createElement('div');q.className='sub';q.textContent=t().colorQuestion;g.append(q);const choices=document.createElement('div');choices.className='choices';t().colors.forEach((x,i)=>choices.append(button(x,()=>i===1?win():roast())));g.append(choices)}if(level===2){const s=document.createElement('div');s.className='symbols';s.textContent='☁️  🌙  ☁️';g.append(s);const star=button('✦',win,'secondary');star.style.cssText='position:absolute;bottom:4px;right:10px;font-size:11px;opacity:.42;padding:7px';star.setAttribute('aria-label',lang==='en'?'Hidden star':'Estrella escondida');g.append(star);g.append(button(lang==='en'?'Open the chest 🔒':'Abrir el cofre 🔒',roast,'primary'))}if(level===3){if(memoryStage===0){const display=document.createElement('div');display.className='symbols';display.textContent='🐸 🍕 🚀';g.append(display);g.append(button(lang==='en'?'Ready!':'¡Listo!',()=>{memoryStage=1;render()},'primary'));}else{const q=document.createElement('div');q.className='sub';q.textContent=t().memoryQuestion;g.append(q);const choices=document.createElement('div');choices.className='choices';['🚀','🍕','🐸','🍉'].forEach((e,i)=>choices.append(button(e,()=>i===1?win():roast())));g.append(choices)}}if(level===4){const p=document.createElement('p');p.className='center';p.style.cssText='font-size:1.3rem;line-height:1.7;font-weight:800';p.append(document.createTextNode(t().finalText));const secret=button(t().finalWord,win,'secondary');secret.style.cssText='display:inline;padding:4px 8px;text-decoration:underline;text-decoration-style:wavy';p.append(secret,document.createTextNode(t().finalEnd));g.append(p);g.append(button(lang==='en'?'I give up 😭':'Me rindo 😭',roast,'primary'))}}function resetRound(){attempts=0;hinted=false;solved=false;memoryStage=0}function save(){localStorage.setItem('lc-level',String(level))}$('langEN').onclick=()=>{lang='en';render()};$('langES').onclick=()=>{lang='es';render()};$('hint').onclick=()=>{hinted=true;speak(t().hints[level])};$('levelTitle').onclick=()=>{if(level===0&&!solved)win()};$('levelTitle').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&level===0){e.preventDefault();win()}};$('next').onclick=()=>{level=level===4?5:level+1;save();resetRound();render()};$('reset').onclick=()=>{if(confirm(t().resetConfirm)){level=0;save();resetRound();render()}};render()})();
