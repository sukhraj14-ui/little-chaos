(()=>{'use strict';const $=id=>document.getElementById(id);const E={en:{chapter:'The cat is causing trouble',start:'Meet the Chaos Cat. It talks, runs around, and cheats at puzzles.',startNote:'Tap Play to enable sound on your phone.',play:'▶ Play',hint:'💡 Hint',next:'Next →',again:'Play again ↻',reset:'Restart all progress?',askTitle:'Ask the Chaos Cat',ask:'Ask',placeholder:'Ask for a hint or about this level…',micNote:'Microphone requires permission; typing always works.',micMissing:'Voice recognition is not supported here. Type your question instead.',micListening:'Listening… say “hint” or ask about the puzzle.',micDenied:'Microphone unavailable. You can type your question.',solved:'Puzzle solved! ✨',finish:'You beat all 12 levels. The cat demands a rematch!',titles:['Don’t Trust the Cat','The Wrong Color','The Tiny Star','Snack Memory','The Secret Word','The Sleeping Cat','Tap the Odd One','The Number Trap','The Upside-Down Trick','The Vanishing Button','Cat’s Favorite Snack','Final Chaos'],instructions:['The cat says to press the big button. Can you find the real way to win?','Choose the color of the LETTERS, not the word.','Find the tiny star hidden in the puzzle.','Remember the middle snack, then answer.','Tap the secret word in the sentence.','Wake the cat up by tapping the moon three times.','Which symbol is different?','Choose the number that comes next: 2, 4, 8, 16, ?','Which arrow points down?','The answer button keeps moving. Catch it!','What snack did the cat mention earlier?','Prove the cat wrong: tap the word “win” below.'],intro:['Press it. I dare you.','Colors are hard. Apparently.','I hid something tiny. Good luck!','I ate one snack. Maybe two.','Words can be sneaky. Like me.','Shhh. I am definitely asleep.','One of these is an impostor.','Math time. Don’t panic.','Try looking carefully this time.','Catch me if you can!','Did you remember my snack?','This is my final evil plan!'],hints:['Tap the level title instead of the big button.','The letters are BLUE.','Look in the bottom-right corner of the puzzle.','The middle snack is pizza.','Tap the word “secret” in the sentence.','Tap the moon three times.','The diamond is the odd one.','Double the previous number.','The downward arrow is ↓.','Try tapping the moving button quickly.','The cat likes pizza.','Tap the word “win” inside the sentence.'],wins:['NO! You found my trick!','Fine, you know colors.','My precious star!','Pizza memory unlocked.','How did you find that?!','I was having a nice nap!','The impostor has been caught.','You did math?!','You are annoyingly observant.','Stop catching my buttons!','Pizza is always the answer.','WHAT?! You actually won!'],roasts:['That was adorable. And wrong.','My tail could solve this faster.','Are you playing with your eyes closed?','I believe in you. Barely.','That button has feelings, you know.','Meow. That was a disaster.','Even my nap was more productive.','Bold choice. Wrong, but bold.','I am adding that to my blooper reel.','You really trusted a cat?','That was not your finest moment.','I almost feel bad. Almost.','My whiskers are disappointed.','Try again, tiny human.','I have seen potatoes do better.','A+ for confidence. F for accuracy.','Please tell me that was a joke.','I would clap, but I have paws.'],answers:{hello:['Meow! I am the Chaos Cat.','Hi! I was plotting something.'],name:['I am the Chaos Cat. No gender, only mischief.'],help:['Ask for a hint and I might be nice. Might.'],voice:['I talk after you tap Play. Check your volume and the speaker icon.'],levels:['There are 12 puzzles. I made most of them unfair.'],thanks:['You are welcome. I expect snacks.'],unknown:['I can help with hints, levels, controls, and this game. For other questions, I am still a tiny cat, not a full AI.','Hmm. I only know about this game right now. Ask me for a hint!']},footer:'Free • No accounts • Progress saved on this device'},es:{chapter:'El gato está haciendo travesuras',start:'Conoce al Gato del Caos. Habla, corre y hace trampas en los acertijos.',startNote:'Pulsa Jugar para activar el sonido.',play:'▶ Jugar',hint:'💡 Pista',next:'Siguiente →',again:'Jugar otra vez ↻',reset:'¿Reiniciar todo el progreso?',askTitle:'Pregúntale al Gato del Caos',ask:'Preguntar',placeholder:'Pregunta por una pista o por el nivel…',micNote:'El micrófono necesita permiso; escribir siempre funciona.',micMissing:'El reconocimiento de voz no funciona aquí. Escribe tu pregunta.',micListening:'Escuchando… di «pista» o pregunta por el nivel.',micDenied:'Micrófono no disponible. Puedes escribir.',solved:'¡Acertijo resuelto! ✨',finish:'¡Superaste los 12 niveles! El gato exige revancha.',titles:['No confíes en el gato','El color equivocado','La estrella pequeña','Memoria de comida','La palabra secreta','El gato dormido','Encuentra el diferente','La trampa numérica','El truco de las flechas','El botón fugitivo','La comida favorita','Caos final'],instructions:['El gato quiere que pulses el botón grande. ¿Cómo se gana de verdad?','Elige el color de las LETRAS, no la palabra.','Encuentra la estrella diminuta escondida.','Recuerda la comida del medio y responde.','Pulsa la palabra secreta en la frase.','Despierta al gato tocando la luna tres veces.','¿Qué símbolo es diferente?','¿Qué número sigue? 2, 4, 8, 16, ?','¿Qué flecha apunta hacia abajo?','El botón se mueve. ¡Atrápalo!','¿Qué comida mencionó el gato antes?','Demuestra que se equivoca: pulsa «ganar».'],intro:['Púlsalo. Te reto.','Los colores son difíciles. Al parecer.','Escondí algo pequeñito. ¡Suerte!','Me comí una comida. Quizás dos.','Las palabras engañan. Como yo.','Shhh. Estoy durmiendo.','Uno de estos es diferente.','Matemáticas. No te asustes.','Mira con atención esta vez.','¡Atrápame si puedes!','¿Recuerdas mi comida?','¡Este es mi plan malvado final!'],hints:['Pulsa el título del nivel, no el botón grande.','Las letras son AZULES.','Mira abajo a la derecha.','La comida del medio es pizza.','Pulsa «secreta» en la frase.','Pulsa la luna tres veces.','El rombo es diferente.','Duplica el número anterior.','La flecha correcta es ↓.','Pulsa el botón que se mueve.','Al gato le gusta la pizza.','Pulsa «ganar» en la frase.'],wins:['¡NO! ¡Descubriste el truco!','Bueno, sabes los colores.','¡Mi preciosa estrella!','Recordaste la pizza.','¿Cómo lo encontraste?','¡Estaba durmiendo!','Encontraste al diferente.','¡Hiciste matemáticas!','Eres demasiado observador.','¡Deja de atrapar mis botones!','La pizza siempre gana.','¿QUÉ? ¡Ganaste de verdad!'],roasts:['Qué adorable. Y qué mal.','Mi cola lo resolvería antes.','¿Juegas con los ojos cerrados?','Confío en ti. Apenas.','Ese botón tiene sentimientos.','Miau. Qué desastre.','Mi siesta fue más productiva.','Decisión valiente. Pero incorrecta.','Lo pondré en mis videos de errores.','¿En serio confiaste en un gato?','No fue tu mejor momento.','Casi me das pena. Casi.','Mis bigotes están decepcionados.','Inténtalo otra vez, humano.','He visto patatas hacerlo mejor.','Sobresaliente en confianza. Suspenso en precisión.','Dime que era una broma.','Aplaudiría, pero tengo patas.'],answers:{hello:['¡Miau! Soy el Gato del Caos.','¡Hola! Estaba tramando algo.'],name:['Soy el Gato del Caos. Sin género, solo travesuras.'],help:['Pide una pista y quizás sea amable.'],voice:['Hablo después de pulsar Jugar. Revisa el volumen y el altavoz.'],levels:['Hay 12 acertijos. Muchos son injustos.'],thanks:['De nada. Quiero comida.'],unknown:['Puedo ayudar con pistas, niveles y controles del juego. No soy una IA completa.','Solo sé cosas de este juego. ¡Pídeme una pista!']},footer:'Gratis • Sin cuentas • Progreso guardado en este dispositivo'}};

length>=pool.length-2)roastHistory=[];while(roastHistory.includes(i))i=rand(pool.length);roastHistory.push(i);speak(pool[i]);moveCat(true)}function win(){if(solved)return;solved=true;speak(t().wins[level]);moveCat(true);$('success').textContent=t().solved;$('success').classList.remove('hidden');$('next').classList.remove('hidden');$('hint').classList.add('hidden');$('next').textContent=level===11?t().again:t().next}function resetRound(){solved=false;attempts=0;moonTaps=0;memoryStage=0}function addSecretSentence(prefix,word,suffix){const p=document.createElement('div');p.style.cssText='font-size:1.25rem;text-align:center;line-height:1.7';p.append(document.createTextNode(prefix));const b=btn(word,win,'secondary');b.style.cssText='display:inline;padding:4px 8px;text-decoration:underline';p.append(b,document.createTextNode(suffix));$('game').append(p)}function render(announce=true){const x=t();document.documentElement.lang=lang;localStorage.setItem('cat-lang',lang);$('en').setAttribute('aria-pressed',String(lang==='en'));$('es').setAttribute('aria-pressed',String(lang==='es'));$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Enable voice':'Mute voice');$('chapter').textContent=x.chapter;$('startDesc').textContent=x.start;$('startNote').textContent=x.startNote;$('play').textContent=x.play;$('hint').textContent=x.hint;$('askTitle').textContent=x.askTitle;$('ask').textContent=x.ask;$('question').placeholder=x.placeholder;$('micStatus').textContent=x.micNote;$('footer').textContent=x.footer;$('success').classList.add('hidden');$('next').classList.add('hidden');$('hint').classList.remove('hidden');$('bar').style.width=(level/12*100)+'%';const g=$('game');g.replaceChildren();if(level>=12){$('bar').style.width='100%';$('title').textContent=lang==='en'?'Chaos defeated!':'¡Caos derrotado!';$('instruction').textContent=x.finish;$('count').textContent='12/12';g.append(btn(x.again,()=>{level=0;localStorage.setItem('cat-level',0);resetRound();render()},'primary'));$('hint').classList.add('hidden');if(announce)speak(x.finish);return}$('title').textContent=x.titles[level];$('count').textContent=`${level+1}/12`;$('instruction').textContent=x.instructions[level];if(solved){$('success').textContent=x.solved;$('success').classList.remove('hidden');$('hint').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=level===11?x.again:x.next;return}if(announce)speak(x.intro[level]);if(level===0)g.append(btn(lang==='en'?'PRESS ME 😈':'PÚLSAME 😈',roast,'primary'));if(level===1){const w=document.createElement('div');w.className='big';w.style.color='#50a9ff';w.textContent=lang==='en'?'RED':'ROJO';g.append(w);const c=document.createElement('div');c.className='choices';(lang==='en'?['Red','Blue','Green','Yellow']:['Rojo','Azul','Verde','Amarillo']).forEach((v,i)=>c.append(btn(v,i===1?win:roast)));g.append(c)}if(level===2){const w=document.createElement('div');w.className='memory';w.textContent='☁️  🌙  ☁️';g.append(w);const star=btn('✦',win,'secondary');star.style.cssText='position:absolute;right:6px;bottom:5px;font-size:12px;opacity:.5;padding:7px';star.setAttribute('aria-label',lang==='en'?'Hidden star':'Estrella escondida');g.append(star,btn(lang==='en'?'Open chest 🔒':'Abrir cofre 🔒',roast,'primary'))}if(level===3){if(!memoryStage){const w=document.createElement('div');w.className='memory';w.textContent='🐸 🍕 🚀';g.append(w,btn(lang==='en'?'Ready!':'¡Listo!',()=>{memoryStage=1;render(false)},'primary'))}else{const c=document.createElement('div');c.className='choices';['🚀','🍕','🐸','🍉'].forEach((v,i)=>c.append(btn(v,i===1?win:roast)));g.append(c)}}if(level===4)addSecretSentence(lang==='en'?'This is a ':'Esta es una palabra ',lang==='en'?'secret':'secreta',lang==='en'?' message.':' en el mensaje.');if(level===5){const b=btn('🌙',()=>{moonTaps++;moveCat(true);if(moonTaps>=3)win();else speak(lang==='en'?`One... ${3-moonTaps} more!`:`Uno... ¡faltan ${3-moonTaps}!`)},'choice chip');g.append(b);const n=document.createElement('div');n.className='mini';n.textContent=lang==='en'?'Tap the moon 3 times':'Toca la luna 3 veces';g.append(n)}if(level===6){const c=document.createElement('div');c.className='choices';['●','●','◆','●'].forEach((v,i)=>c.append(btn(v,i===2?win:roast)));g.append(c)}if(level===7){const c=document.createElement('div');c.className='choices';['24','30','32','64'].forEach((v,i)=>c.append(btn(v,i===2?win:roast)));g.append(c)}if(level===8){const c=document.createElement('div');c.className='choices';['↑','←','↓','→'].forEach((v,i)=>c.append(btn(v,i===2?win:roast)));g.append(c)}if(level===9){const b=btn(lang==='en'?'CATCH ME!':'¡ATRÁPAME!',win,'primary');b.style.position='relative';b.onpointerenter=()=>{if(Math.random()<.45)b.style.transform=`translate(${rand(55)-27}px,${rand(25)-12}px)`};g.append(b,btn(lang==='en'?'Wrong button':'Botón incorrecto',roast,'secondary'))}if(level===10){const c=document.createElement('div');c.className='choices';['🥦','🍕','🥕','🍋'].forEach((v,i)=>c.append(btn(v,i===1?win:roast)));g.append(c)}if(level===11)addSecretSentence(lang==='en'?'You will never ':'Nunca vas a ',lang==='en'?'win':'ganar',lang==='en'?' against me!':' contra mí!')}
function askCat(q){const a=q.toLowerCase().trim();if(!a)return;let response;const answers=t().answers;if(/hint|pista|stuck|atascad|ayuda|help me|solution|soluci/.test(a))response=t().hints[Math.min(level,11)];else if(/hello|hi|hey|hola|buenas/.test(a))response=answers.hello[rand(answers.hello.length)];else if(/name|nombre|who are you|quién eres|gender|género/.test(a))response=answers.name[0];else if(/help|ayuda|how|cómo/.test(a))response=answers.help[0];else if(/voice|sound|speak|audio|voz|habla|sonido/.test(a))response=answers.voice[0];else if(/level|nivel|puzzle|acertijo/.test(a))response=answers.levels[0];else if(/thank|gracias/.test(a))response=answers.thanks[0];else response=answers.unknown[rand(answers.unknown.length)];speak(response);moveCat(true)}$('play').onclick=()=>{started=true;$('start').classList.add('hidden');moveCat(true);roam();render(true)};$('mute').onclick=()=>{muted=!muted;localStorage.setItem('cat-muted',muted?'yes':'no');if(muted&&'speechSynthesis'in window)speechSynthesis.cancel();$('cat').classList.remove('talking');$('mute').textContent=muted?'🔇':'🔊';if(!muted)speak($('speech').textContent)};$('en').onclick=()=>{lang='en';render()};$('es').onclick=()=>{lang='es';render()};$('hint').onclick=()=>speak(t().hints[Math.min(level,11)]);$('title').onclick=()=>{if(level===0)win()};$('title').setAttribute('tabindex','0');$('title').setAttribute('role','button');$('title').onkeydown=e=>{if(level===0&&(e.key==='Enter'||e.key===' ')){e.preventDefault();win()}};$('next').onclick=()=>{level++;localStorage.setItem('cat-level',level);resetRound();render()};$('reset').onclick=()=>{if(confirm(t().reset)){level=0;localStorage.setItem('cat-level',0);resetRound();render()}};$('ask').onclick=()=>{askCat($('question').value);$('question').value=''};$('question').onkeydown=e=>{if(e.key==='Enter')$('ask').click()};$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('micStatus').textContent=t().micMissing;return}try{if(recognition)recognition.abort();recognition=new SR();recognition.lang=lang==='es'?'es-ES':'en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onresult=e=>{const q=e.results[0][0].transcript;$('question').value=q;askCat(q)};recognition.onerror=()=>{$('micStatus').textContent=t().micDenied};recognition.onend=()=>{$('micStatus').textContent=t().micNote};$('micStatus').textContent=t().micListening;recognition.start()}catch(e){$('micStatus').textContent=t().micDenied}};document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)speechSynthesis.cancel()});render(false);moveCat();})();
